<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
      
       
    </style>
</head>
<body>
    <div class="container-fluid d-flex align-items-center justify-content-center actualheight bg-dark">
        <div class="row heightrow">
            <div class="col-lg-4 col-md-5 bg-light mx-auto w-100 corners">
                <h1 class="text-center heading">Music Player</h1>
                <div class="outline mx-auto"></div>

                <div class="details">
                    <div class="nowplaying"></div>
                </div>
        
                <div class="slider_container">
                    <div class="current-time">00:00</div>
                    <input type="range" min="1" max="100" value="0" class="seek_slider" onclick="seekTo()">
                    <div class="total-duration">00:00</div>
                </div>
                <div class="buttons">
                <div class="random-track" onclick="randomtrack()">
                    <i class="fa fa-random fa-2x"></i>
                </div>
                <div class="prev-track" onclick="prevtrack()">
                    <i class="fa fa-step-backward fa-2x"></i>
                </div>
                <div class="play-track" onclick="palytrack()">
                    <i class="fa fa-play-circle fa-2x"></i>
                </div>
                <div class="next-track" onclick="nexttrack()">
                    <i class="fa fa-step-forward fa-2x"></i>
                </div>
                <div class="repeat-track" onclick="repeattrack()">
                    <i class="fa fa-repeat fa-2x"></i>
                </div>
                </div>
            </div>

        </div>

    </div>
    <script src="./script.js"></script>

</body>
</html>
